name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: 下载依赖
        run: go mod download

      - name: 运行测试
        run: go test -v ./...

      - name: 编译项目
        run: go build -o my-api cmd/server/main.go

      - name: 上传编译产物（可选）
        uses: actions/upload-artifact@v4
        with:
          name: my-api
          path: my-api
